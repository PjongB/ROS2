<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ROS2 문제 풀기</title>
<style>
:root{--bg:#07110f;--panel:#0e1b17;--line:#294239;--ink:#eff8f3;--muted:#9bb1a7;--mint:#5be2b0;--yellow:#f3c75d;--red:#ff8e7c}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% -10%,#174333,transparent 32%),var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}.shell{width:min(920px,calc(100% - 32px));margin:auto}.top{height:70px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}a{color:inherit;text-decoration:none}.brand{font-weight:900}.brand b{color:var(--mint)}.back{color:var(--muted);font-size:13px}.intro{padding:65px 0 35px}.kicker{color:var(--mint);font:750 12px ui-monospace;letter-spacing:.13em}.intro h1{margin:10px 0;font-size:clamp(42px,8vw,72px);line-height:1;letter-spacing:-.06em}.intro p{color:var(--muted);line-height:1.7}.setup,.quiz,.finish{padding:26px;border:1px solid var(--line);border-radius:18px;background:rgba(14,27,23,.94);margin-bottom:70px}.setup h2{margin-top:0}.categories{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin:18px 0}.categories label{padding:12px;border:1px solid var(--line);border-radius:11px;color:var(--muted);cursor:pointer}.categories input{accent-color:var(--mint)}.row{display:flex;gap:10px;flex-wrap:wrap}.select{padding:12px;border:1px solid var(--line);border-radius:10px;background:#09130f;color:var(--ink)}button{border:0;cursor:pointer}.primary{padding:12px 18px;border-radius:10px;background:var(--mint);color:#052018;font-weight:850}.ghost{padding:12px 18px;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--muted)}.hidden{display:none}.status{display:flex;justify-content:space-between;color:var(--muted);font-size:13px}.bar{height:4px;background:#182a23;margin:14px 0 32px}.bar i{display:block;height:100%;background:var(--mint)}.tag{display:inline-block;padding:5px 9px;border:1px solid var(--line);border-radius:99px;color:var(--mint);font-size:11px}.question{font-size:25px;line-height:1.45;letter-spacing:-.025em}.answers button{display:block;width:100%;margin:10px 0;padding:15px;text-align:left;border:1px solid var(--line);border-radius:12px;background:#12231d;color:var(--ink);font-size:15px}.answers button:hover{border-color:#568475}.answers button.good{border-color:var(--mint);background:#102d23}.answers button.bad{border-color:var(--red);background:#301914}.explain{min-height:60px;margin-top:18px;padding:15px;border-left:3px solid var(--yellow);background:#201c10;color:#e4d7a0;line-height:1.6}.next{margin-top:18px}.finish{text-align:center}.score{font-size:70px;font-weight:900;color:var(--mint);letter-spacing:-.07em}.finish p{color:var(--muted)}@media(max-width:620px){.categories{grid-template-columns:1fr}.setup,.quiz{padding:19px}.question{font-size:21px}}
</style></head><body><header class="shell top"><a class="brand" href="index.html"><b>ROS</b>2 QUIZ</a><a class="back" href="index.html">← 전체 강의</a></header><main class="shell"><section class="intro"><div class="kicker">60 QUESTIONS · INSTANT FEEDBACK</div><h1>문제로<br>확인하기.</h1><p>학습 범위와 문제 수를 고르면 무작위로 출제됩니다. 틀린 문제는 마지막에 다시 풀 수 있습니다.</p></section><section id="setup" class="setup"><h2>출제 범위</h2><div id="categories" class="categories"></div><div class="row"><select id="count" class="select"><option value="10">10문제</option><option value="20">20문제</option><option value="30">30문제</option><option value="60">전체 60문제</option></select><button id="start" class="primary">문제 풀기</button></div></section><section id="quiz" class="quiz hidden"><div class="status"><span id="position"></span><span id="scoreText"></span></div><div class="bar"><i id="bar"></i></div><span id="tag" class="tag"></span><h2 id="question" class="question"></h2><div id="answers" class="answers"></div><div id="explain" class="explain"></div><button id="next" class="primary next hidden">다음 문제 →</button></section><section id="finish" class="finish hidden"><div class="kicker">RESULT</div><div id="finalScore" class="score"></div><h2 id="finalTitle"></h2><p id="finalText"></p><div class="row" style="justify-content:center"><button id="retryWrong" class="primary">오답 다시 풀기</button><button id="restart" class="ghost">새 문제 시작</button></div></section></main><script src="quiz.js"></script></body></html>
